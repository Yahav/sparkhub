{% extends "base.html" %}
{% block title %}Code · SparkHub{% endblock %}
{% block main %}
<section class="auth">
  <h1>{% include "_logo.html" %}Authenticator code</h1>
  <p class="muted">For {{ username }}. Enter the 6-digit code, or one of your recovery codes (xxxxxx-xxxxxx).</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login/totp">
    <input type="hidden" name="csrf" value="{{ login_csrf }}">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="32"></label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
