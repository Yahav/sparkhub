# SparkHub Prometheus, generated by ./install.sh from templates/observability/prometheus.yml.
# Everything on 127.0.0.1 (host network). Only one model container runs at a time; the other target is simply down.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sparkhub
    static_configs:
      - targets: ["127.0.0.1:{{HUB_PORT}}"]

  - job_name: vllm
    static_configs:
      - targets: ["127.0.0.1:{{FAST_PORT}}"]
        labels: {mode: fast}
      - targets: ["127.0.0.1:{{QUALITY_PORT}}"]
        labels: {mode: quality}

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:{{NODE_EXPORTER_PORT}}"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:{{PROMETHEUS_PORT}}"]
