# Generated by ./install.sh from templates/nginx/listen-sparkhub.conf.
{{#HTTP}}
# :{{HTTP_PORT}} for known names: ACME challenge (Let's Encrypt HTTP-01) + redirect to https
server {
{{HTTP_LISTEN}}
    server_name {{SERVER_NAMES}};
    location /.well-known/acme-challenge/ { root /srv/sparkhub/acme; }
{{#CA_HTTP}}
    location = /ca.crt { alias /etc/nginx/tls/ca.crt; default_type application/x-x509-ca-cert; }   # see below
{{/CA_HTTP}}
    location / { return 301 https://$host{{HTTPS_PORT_SUFFIX}}$request_uri; }
}

# :{{HTTP_PORT}} for anything else (bare IP, scanners): close the connection
server {
{{HTTP_LISTEN_DEFAULT}}
    server_name _;
    location /.well-known/acme-challenge/ { root /srv/sparkhub/acme; }
{{#CA_HTTP}}
    # the local CA's certificate (public by nature) for devices that do not trust it yet; not on a public install
    location = /ca.crt { alias /etc/nginx/tls/ca.crt; default_type application/x-x509-ca-cert; }
{{/CA_HTTP}}
    location / { return 444; }
}

{{/HTTP}}
# Every other name, and the names covered by the local SparkHub CA (data/tls): tailnet name, LAN address.
# Listen addresses come from LISTEN_ADDRS (never 0.0.0.0 unless that is meant: the NAT may forward 443).
server {
{{LISTEN_DEFAULT}}
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    include /etc/nginx/sparkhub/sparkhub-locations.inc;
}
