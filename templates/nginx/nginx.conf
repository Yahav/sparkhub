# SparkHub nginx (host network), generated by ./install.sh from templates/nginx/nginx.conf.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 75s;

    # No query strings in the log (they can carry tokens); no request bodies are ever logged.
    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /dev/stdout main;

    # login: only attempts (POST) count; viewing the login page is free (an empty key is not limited)
    map $request_method $login_attempt_key { POST $binary_remote_addr; default ""; }
    limit_req_zone $login_attempt_key zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    upstream hub { server 127.0.0.1:{{HUB_PORT}}; keepalive 32; }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/sparkhub/listen-*.conf;
}
