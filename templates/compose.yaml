# SparkHub stack, generated by ./install.sh from sparkhub.conf and templates/compose.yaml: edit those, not this file.
# The model containers are not here: the hub creates them.
name: {{INSTANCE}}

services:
  hub:
    build: ./hub
    image: {{INSTANCE}}-hub:dev
    container_name: {{INSTANCE}}-hub
    restart: unless-stopped
    network_mode: host            # listens on 127.0.0.1:{{HUB_PORT}} only; reaches the models on 127.0.0.1
    user: "{{RUN_UID}}:{{RUN_GID}}"
    group_add: ["{{DOCKER_GID}}"]            # docker group on the host (root-equivalent)
    command: ["uvicorn", "sparkhub.main:app_factory", "--factory", "--host", "127.0.0.1", "--port", "{{HUB_PORT}}",
              "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1", "--timeout-keep-alive", "75", "--no-server-header"]
    environment:
      SPARKHUB_INSTANCE: {{INSTANCE}}
      SPARKHUB_MODES: "{{MODES}}"
      SPARKHUB_PORT_FAST: "{{FAST_PORT}}"
      SPARKHUB_PORT_QUALITY: "{{QUALITY_PORT}}"
      SPARKHUB_EMBEDDINGS: "{{EMBEDDINGS}}"           # the embedding service (Settings → Models → Embeddings)
      SPARKHUB_ARCANE: "{{ARCANE}}"                   # header links only for what is installed
      SPARKHUB_BENCH: "{{BENCH}}"                     # the Benchmarks page and its runner image
      SPARKHUB_BENCH_IMAGE: {{INSTANCE}}-bench:dev
      SPARKHUB_HOST_DATA_DIR: {{ROOT}}/data           # data/ at its host path: the runner and Harbor mount from it
      SPARKHUB_GATEWAY_ADDR: {{ISSUER_ADDR}}          # where the runner and the agents' containers reach nginx
      SPARKHUB_VERSION: "{{VERSION}}"                 # VERSION; the daily release check compares against it
      SPARKHUB_NVIDIA_DASHBOARD: "{{NVIDIA_DASHBOARD}}"
      SPARKHUB_PORT_EMBED: "{{EMBED_PORT}}"
      SPARKHUB_PORT_RERANK: "{{RERANK_PORT}}"
      SPARKHUB_AUTOSTART: "{{AUTOSTART}}"
      SPARKHUB_HOST_PRESETS_DIR: {{ROOT}}/presets
      SPARKHUB_HOST_HF_CACHE: {{HF_CACHE}}
      SPARKHUB_HOST_MODELS_DIR: {{MODELS_DIR}}
      SPARKHUB_HELPER_IMAGE: {{INSTANCE}}-hub:dev
      SPARKHUB_PROMETHEUS_URL: http://127.0.0.1:{{PROMETHEUS_PORT}}
      SPARKHUB_PUBLIC_HOST: {{PUBLIC_HOST}}
      SPARKHUB_PUBLIC_CERT_TRUSTED: "{{PUBLIC_CERT_TRUSTED}}"   # 0: the local CA signs PUBLIC_HOST's certificate too
      SPARKHUB_OIDC_ISSUER: {{PUBLIC_URL}}/oidc
      SPARKHUB_TLS_NAMES: "{{TLS_NAMES}}"
      SPARKHUB_TLS_PORT: "{{HTTPS_PORT}}"
{{#CHATUI}}
      SPARKHUB_CHAT_CONTAINER: {{INSTANCE}}-chatui     # the hub starts and stops it (Settings → Chat)
{{/CHATUI}}
      TZ: {{TZ}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/srv/sparkhub/data
      - ./presets:/srv/sparkhub/presets:ro
      - ./clients:/srv/sparkhub/clients:ro
      # the model directories at their host paths (read-only): the hub checks a mode's weights before loading it
      - {{HF_CACHE}}:{{HF_CACHE}}:ro
      - {{MODELS_DIR}}:{{MODELS_DIR}}:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]   # nvidia-smi only (GPU collector), no compute
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e   # v3.15.0
    container_name: {{INSTANCE}}-prometheus
    restart: unless-stopped
    network_mode: host
    user: "{{RUN_UID}}:{{RUN_GID}}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1y
      - --storage.tsdb.retention.size=20GB
      - --web.listen-address=127.0.0.1:{{PROMETHEUS_PORT}}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0   # v1.12.1
    container_name: {{INSTANCE}}-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:{{NODE_EXPORTER_PORT}}
      - --no-collector.cpufreq        # hangs on the GB10 (2026-10-23), every scrape timed out
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/snap/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  grafana:
    image: grafana/grafana@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f   # 13.2.4
    container_name: {{INSTANCE}}-grafana
    restart: unless-stopped
    network_mode: host
    user: "{{RUN_UID}}:{{RUN_GID}}"
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "{{GRAFANA_PORT}}"
      GF_SERVER_ROOT_URL: {{PUBLIC_URL}}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Login is SparkHub's: nginx auth_request sets X-WEBAUTH-USER; Grafana trusts it from 127.0.0.1 only
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 127.0.0.1
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/sparkhub.json
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
{{#ARCANE}}

  arcane:
    # Docker UI: Arcane with base-path support, at {{PUBLIC_URL}}/arcane behind the hub login in nginx.
    # It signs in through the hub (OIDC), so there is no second password. Its own bridge network so only
    # 127.0.0.1:{{ARCANE_PORT}} is published (its internal actor port 3551 stays inside); nginx reaches it via
    # docker-proxy from the gateway.
    image: {{ARCANE_IMAGE}}
    container_name: {{INSTANCE}}-arcane
    restart: unless-stopped
    ports: ["127.0.0.1:{{ARCANE_PORT}}:3552"]
    networks: [arcane]
    environment:
      APP_URL: {{PUBLIC_URL}}/arcane
      TRUSTED_PROXIES: {{ARCANE_GATEWAY}}/32     # the network gateway = docker-proxy carrying nginx's requests
      ANALYTICS_DISABLED: "true"           # no heartbeat to Arcane's analytics endpoint
      UPDATE_CHECK_DISABLED: "true"        # a fork: upstream release notices don't apply
      OIDC_ENABLED: "true"
      OIDC_ISSUER_URL: {{PUBLIC_URL}}/oidc
      OIDC_CLIENT_ID: arcane
      OIDC_SCOPES: openid profile groups
      OIDC_PROVIDER_NAME: SparkHub
      OIDC_AUTO_REDIRECT_TO_PROVIDER: "true"
      OIDC_ROLE_MAPPINGS: '[{"claimValue":"sparkhub-admin","roleId":"role_admin"}]'   # hub admins = Arcane admins
{{#ARCANE_LOCAL_CA}}
      SSL_CERT_FILE: /etc/sparkhub-ca.crt  # the issuer's certificate comes from the local SparkHub CA
{{/ARCANE_LOCAL_CA}}
      TZ: {{TZ}}
    extra_hosts:
      - "{{PUBLIC_HOST}}:{{ISSUER_ADDR}}"        # back channel to the issuer straight to nginx, not via the router
    env_file:
      - ./data/arcane.env                  # ENCRYPTION_KEY, JWT_SECRET, OIDC_CLIENT_SECRET (secrets; not in git)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/arcane:/app/data
{{#ARCANE_LOCAL_CA}}
      - ./data/tls/ca.crt:/etc/sparkhub-ca.crt:ro
{{/ARCANE_LOCAL_CA}}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
{{/ARCANE}}
{{#CHATUI}}

  chatui:
    # Web chat (Hugging Face chat-ui, built by ./install.sh with APP_BASE=/chat) at {{PUBLIC_URL}}/chat/, behind the
    # hub login in nginx. It signs in through the hub (OIDC), so each hub user has their own history, and talks to
    # the hub's /v1 with its own API key. MongoDB (the history) runs inside, in data/chatui. The hub starts and
    # stops the container (Settings → Chat). Own bridge network; only 127.0.0.1:{{CHATUI_PORT}} is published.
    image: {{CHATUI_IMAGE}}
    container_name: {{INSTANCE}}-chatui
    restart: unless-stopped
    user: "{{RUN_UID}}:{{RUN_GID}}"
    ports: ["127.0.0.1:{{CHATUI_PORT}}:3000"]
    networks: [chatui]
    environment:
      PUBLIC_ORIGIN: {{PUBLIC_URL}}
      PROTOCOL_HEADER: x-forwarded-proto   # nginx terminates TLS; otherwise the OIDC redirect URI is wrong
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
      OPENAI_BASE_URL: {{PUBLIC_URL}}/v1
      OPENID_PROVIDER_URL: {{PUBLIC_URL}}/oidc
      OPENID_CLIENT_ID: chatui
      OPENID_SCOPES: openid profile
      OPENID_NAME_CLAIM: name
      AUTOMATIC_LOGIN: "true"
      # a new hub login (another user, or after logging out) ends chat-ui's session too
      COUPLE_SESSION_WITH_COOKIE_NAME: __Host-sparkhub
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      ADMIN_CLI_LOGIN: "false"
      ALLOW_IFRAME: "false"
      PUBLIC_APP_NAME: SparkHub Chat
      PUBLIC_APP_DESCRIPTION: Chat with the model running on this DGX Spark.
      # only the auto pair (whatever mode is loaded); fast/quality/custom would fail while another mode is loaded
      MODELS: >-
        [{"id": "auto", "displayName": "SparkHub", "description": "The model loaded now (Fast, Quality or Custom)"},
        {"id": "auto-thinking", "displayName": "SparkHub (thinking)", "description": "The loaded model, thinking first"},
        {"id": "fast", "unlisted": true}, {"id": "fast-thinking", "unlisted": true},
        {"id": "quality", "unlisted": true}, {"id": "quality-thinking", "unlisted": true},
        {"id": "custom", "unlisted": true}, {"id": "custom-thinking", "unlisted": true}]
      TASK_MODEL: auto                     # conversation titles
{{#LOCAL_CA}}
      NODE_EXTRA_CA_CERTS: /etc/sparkhub-ca.crt   # the hub's certificate comes from the local SparkHub CA
{{/LOCAL_CA}}
      TZ: {{TZ}}
    extra_hosts:
      - "{{PUBLIC_HOST}}:{{ISSUER_ADDR}}"        # OIDC and /v1 straight to nginx, not via the router
    env_file:
      - ./data/chatui.env                  # OPENAI_API_KEY, OPENID_CLIENT_SECRET (secrets; not in git)
    volumes:
      - ./data/chatui:/data/db
{{#LOCAL_CA}}
      - ./data/tls/ca.crt:/etc/sparkhub-ca.crt:ro
{{/LOCAL_CA}}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
{{/CHATUI}}

  nginx:
    image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951   # 1.30.6-alpine
    container_name: {{INSTANCE}}-nginx
    restart: unless-stopped        # also retries until tailscale0 has its address after a boot
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/sparkhub:ro
      - ./data/tls:/etc/nginx/tls:ro
      - ./data/acme:/srv/sparkhub/acme:ro
{{#LETSENCRYPT}}
      - /etc/letsencrypt:/etc/letsencrypt:ro
{{/LETSENCRYPT}}
    depends_on: [hub]
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
{{#NETWORKS}}

networks:
{{/NETWORKS}}
{{#ARCANE}}
  arcane:
    ipam:
      config: [{subnet: {{ARCANE_SUBNET}}, gateway: {{ARCANE_GATEWAY}}}]
{{/ARCANE}}
{{#CHATUI}}
  chatui:
    ipam:
      config: [{subnet: {{CHATUI_SUBNET}}}]
{{/CHATUI}}
